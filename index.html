<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="./manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coastline Burgers Menu Board</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="default-mode">
    <div id="app-container">
        <div id="overlay" class="mode-overlay"></div>

        <main class="menu-container">
            <!-- Header -->
            <header class="header">
                <div class="logo-section">
                    <img data-bind-src="storefront.logo" data-bind-attr="alt:storefront.store_name" src="" alt="Logo" class="logo-img" style="width: 40px; height: 40px; object-fit: contain;">
                    <h1 data-bind-text="storefront.store_name">COASTLINE BURGERS</h1>
                </div>
                <div class="info-section">
                    <div class="locations" id="locations-list">
                        <!-- Dynamic locations -->
                    </div>
                    <div id="clock" class="clock" data-bind-show="app_settings.show_clock">00:00:00</div>
                </div>
            </header>

            <!-- Hero Section -->
            <section class="hero">
                <div class="hero-content">
                    <h2 id="special-heading" data-bind-text="hero_section.heading">DAILY SPECIALS</h2>
                    <p id="special-subtext" data-bind-text="hero_section.subtext">Fresh. Local. Grilled to perfection.</p>
                </div>
                <div class="hero-image">
                    <img data-bind-src="hero_section.image" data-bind-attr="alt:hero_section.heading" src="https://loremflickr.com/800/600/burger,grilled?random=1" alt="Featured Burger">
                </div>
            </section>

            <!-- Menu Grid -->
            <div class="menu-grid" id="menu-grid">
                <!-- Dynamic categories and products will be rendered here -->
            </div>

            <!-- Promo Section (Lunch Rush) -->
            <section class="menu-section promo" id="promo-section" data-bind-show="promo_section.show_promo">
                <div class="promo-card">
                    <div class="promo-badge" data-bind-text="promo_section.badge">LUNCH COMBO</div>
                    <h3 data-bind-text="promo_section.title">THE PERFECT PAIR</h3>
                    <p data-bind-text="promo_section.description">Burger + Fries + Soda</p>
                    <div class="promo-price" data-bind-currency="promo_section.price">$13.99</div>
                    <small data-bind-text="promo_section.availability">Available 11am - 2pm</small>
                </div>
            </section>

            <!-- Footer -->
            <footer class="footer">
                <p data-bind-text="storefront.footer_text">Join our loyalty program! | coastlineburgers.com</p>
            </footer>
        </main>
    </div>

    <script src="script.js"></script>
    <script>
        // Initialize Lucide icons
        lucide.createIcons();
    </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js')
          .then(function (reg) { console.log('[PWA] SW registered:', reg.scope); })
          .catch(function (err) { console.warn('[PWA] SW registration failed:', err); });
      });
    }
  </script>
</body>
</html>
